# Synthetic experiment with causal content SCM.
_base_: synthetic_defaults

tag: synthetic-causal-projection-entropy-tau-bs-264
synthetic_normalize: fixed_reference
synthetic_causal: true
synthetic_causal_graph: random
synthetic_causal_edge_prob: 0.5
scale_contrastive_loss: 1
scale_recon_loss: 1
# vq_commitment_weight: 0
inject_style_to_decoder: true
tau: 1.0
patch_grid: [8, 8, 8]
train_steps: 300000
# spatial_size: 4
eval_dci: true
checkpoint_steps: 1000
scale_adv_loss: 0.0
# style_dropout_prob: 0.2
batch_size: 264
vqvae_hidden_channels: 48
vqvae_embed_dim: 48
vqvae_scaling_rates: [4]
deterministic: true
content_size: 44
style_injection_mode: input
no_final_recon_norm: true
separate_style_codebooks: true
separate_content_codebooks: false
# synthetic_clean_content: true
patch_contrastive: false
contrastive_proj_dim: 16     # >0 enables it; 0 (default) = off
contrastive_proj_hidden: 128  # optional, defaults to 256
contrastive_proj_mode: bounded
tau_entropy: 1
# patch_foreground_mask: true
# patch_foreground_thresh: 0.05
# contrastive_loss_type: vicreg
