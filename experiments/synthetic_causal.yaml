# Synthetic experiment with causal content SCM.
_base_: synthetic_defaults

tag: synthetic-causal-random-new-16-noise-baseline
synthetic_normalize: fixed_reference
synthetic_causal: true
synthetic_causal_graph: random
synthetic_causal_edge_prob: 0.5
scale_contrastive_loss: 0
scale_recon_loss: 1
# vq_commitment_weight: 0
inject_style_to_decoder: true
tau: 0.07
patch_grid: [4, 4, 4]
train_steps: 300000
# spatial_size: 4
eval_dci: true
checkpoint_steps: 1000
scale_adv_loss: 0.0
# style_dropout_prob: 0.2
batch_size: 64
vqvae_hidden_channels: 16
vqvae_embed_dim: 16
vqvae_scaling_rates: [4]
deterministic: true
content_size: 13
style_injection_mode: input
no_final_recon_norm: true
separate_style_codebooks: true
separate_content_codebooks: true
# synthetic_clean_content: true
synthetic_style_scale:   3.0   # ×(gain, bias, noise-sigma, bias-field) — nuisance-dominant
synthetic_content_scale: 0.3   # ×(brain/ventricle/cortex/temporal/asymmetry/sulcal) — subtle content
