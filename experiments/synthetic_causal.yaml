_base_: synthetic_defaults
tag: synthetic-clean-content-causal-vicregl-rescaled
resume_training: false

# Registered local/global VICReg
contrastive_loss_type: vicregl
use_moco: false
mask_mode: fixed

patch_contrastive: true
patch_grid: [8, 8, 8]  # 512 spatial bins
patch_center_mode: none
patch_foreground_mask: true
patch_foreground_thresh: 0.05

# Disable the generic projector; VICRegL uses its own heads.
contrastive_proj_dim: 0
contrastive_proj_mode: head

vicregl_local_weight: 1.0
vicregl_global_weight: 0.25
vicregl_no_projectors: false

vicreg_sim_coeff: 25.0
vicreg_std_coeff: 25.0
vicreg_cov_coeff: 1.0

# Starting scale; inspect weighted losses and gradients before a long run.
scale_contrastive_loss: 1.0
scale_recon_loss: 16

# Training
single_count_commitment: true
grad_clip_norm: 100
batch_size: 64
deterministic: true
checkpoint_steps: 1000
eval_dci: true

# Existing style objectives
scale_style_hsic_loss: 0
scale_style_contrastive_loss: 0.0

# Content/style architecture
content_size: 12
norm_type: layer
decoder_norm_type: group
no_final_recon_norm: true

inject_style_to_decoder: true
style_injection_mode: input
separate_style_codebooks: true
separate_content_codebooks: false

vqvae_nb_levels: 1
vqvae_nb_res_layers: 2
vqvae_hidden_channels: 16
vqvae_embed_dim: 16
vqvae_scaling_rates: [4]

# Synthetic data
synthetic_identifiable_ventricle: true
synthetic_clean_content: true
synthetic_normalize: fixed_reference
synthetic_causal: true
synthetic_causal_graph: random
synthetic_causal_edge_prob: 0.5
synthetic_res: 64