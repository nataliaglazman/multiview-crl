_base_: synthetic_defaults
tag: synthetic-causal-12-4-cross-recon
contrastive_loss_type: barlow_twins
# bt_lambda: 0.16                 # NOT 0.005 — see the calibration note above
patch_contrastive: true
patch_grid: [8,8,8]                 # 4x4x4 patches for 64^3 volumes
patch_center_mode: position   # now wired for BT; do NOT use double
patch_foreground_mask: true
patch_foreground_thresh: 0.05
bt_gap_weight: 1                  # NOT 0.01 — see the calibration note above
# bt_gap_lambda: 0.16               # NOT 0.005 — see the calibration note above
bt_patch_weight: 1
single_count_commitment: true
vicregl_no_projectors: true
cross_recon_start_step: 0
scale_cross_recon_loss: 10

scale_contrastive_loss: 100      # NOT 10 — BT's raw scale is ~10x InfoNCE's
grad_clip_norm: 100
batch_size: 64
synthetic_identifiable_ventricle: true
contrastive_proj_dim: 0
synthetic_lesion_placement: wm_interior
synthetic_lesion_radius: 0.1

# # --- leak (b): make style non-degenerate so recon stops using content ---
scale_style_hsic_loss: 0
scale_style_contrastive_loss: 10
style_spatial_size: 1
style_contrastive_mode: within_modality
# style_dropout_prob: 0.2
# style_nb_entries: 
# quantize_style: false


content_size: 12              # match the baseline; fixes the 44-vs-48 confound
synthetic_normalize: fixed_reference
synthetic_causal: false
synthetic_causal_graph: random
synthetic_causal_edge_prob: 0.5
synthetic_res: 64
norm_type: layer
decoder_norm_type: group
no_final_recon_norm: true
inject_style_to_decoder: true
style_injection_mode: input
separate_style_codebooks: true
separate_content_codebooks: false
vqvae_nb_levels: 1
vqvae_nb_res_layers: 2
vqvae_hidden_channels: 16
vqvae_embed_dim: 16
vqvae_scaling_rates: [4]
deterministic: true
checkpoint_steps: 1000
eval_dci: true
# detach_style_injection: true
synthetic_clean_content: true

bt_sim_normalize: false
bt_normalize_terms: true
bt_lambda: 6
bt_gap_lambda: 6
bt_sim_coeff: 0.0114     # 0.5 / 44
bt_std_coeff: 0.227      # 10 / 44
# bt_gap_std_coeff: 0.05
# bt_gap_sim_coeff: 0.05

bt_corr_ema: 0.99
scale_recon_loss: 10
iid_probe_every: 2000