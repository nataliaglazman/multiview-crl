# synthetic_identifiable.yaml with ONE generator change: the ventricle's cross-view
# amplitude ratio is matched. Everything else — model, objective, every other generator
# setting — is inherited unchanged, so this is a clean causal test of one variable.
#
# WHY. ventricle_size is the only factor the contrastive run loses to its recon-only
# ablation (gap -0.089, patch -0.175, and the only NEGATIVE `learned` at patch, -0.126:
# active removal, not failure to acquire). Two explanations have been refuted:
#
#   sign inversion (20 Aug)   eval/view_consistency measures cos(T1, FLAIR) = 0.992 for
#                             the ventricle — the MOST view-consistent factor of the nine,
#                             while cortical_thickness (a big winner) is far lower. Dead.
#   occupancy dilution (H1)   eval/bt_channel_pressure: no channel is spatially sparse in
#                             any arm (occupancy p10 0.50-0.62), so the folded patch term
#                             has no sparse population to dilute, and the BT arm is LESS
#                             dense than recon-only — the opposite of the prediction. Dead.
#
# What survives is amplitude: the ventricle's CSF/WM step is -0.70 in T1 against -0.30 in
# FLAIR, ratio 0.428, the largest same-sign mismatch in the generator. And BT drives every
# channel to cross-view consistency (mean c_ii 0.941, vs 0.060 recon-only / 0.119 at init,
# with NO rank collapse: eff_rank 18.2 vs 20.9 / 19.1), while in the arms not optimised
# against that objective the ventricle is read by the LEAST view-consistent channels
# (w.c_ii 0.040 vs 0.060 baseline; 0.097 vs 0.119 untrained) — an ordering already present
# at random init (rho 0.810) that predicts which factors the objective helps or hurts
# (rho +0.857 against the contrastive-minus-ablation delta).
#
# That is predictive, not causal. This config makes it causal.
#
# THE KNOB, AND WHY IT NEEDS TWO. ventricle_size is read from the CSF/WM step:
# |csf_t1 - 0.8| in T1 against |csf_flair - 0.4| in FLAIR. With FLAIR pinned at 0.1 the
# ratio is exactly 0.30/step_T1, so ratio and T1 amplitude are the SAME VARIABLE and no
# single-knob run can tell them apart. Worse, the only same-sign matched value, 0.5, is
# also the GM intensity, so the ventricle renders at cortex level in T1 and ventricle_size
# picks up a confound with brain_size / cortical_thickness. A first attempt at (0.5, 0.1)
# degraded ventricle recovery, which is exactly what those two penalties predict and tells
# you nothing about the ratio.
#
# With both knobs the 2x2 opens up. All four are same-sign; all but cell 2 are collision-free:
#
#   cell                     csf=(t1, flair)   steps        ratio   gmean amp
#   1 baseline               (0.100, 0.100)    0.700/0.300  0.429   0.458
#   2 matched, low amp       (0.500, 0.100)    0.300/0.300  1.000   0.300   <- csf == GM in T1
#   3 matched, best amp      (0.450, 0.050)    0.350/0.350  1.000   0.350   <- this file
#   4 UNMATCHED, cell-2 amp  (0.342, 0.203)    0.458/0.197  0.430   0.300   <- the control
#
# READING IT. Compare ventricle_size's contrastive-minus-ablation DELTA (not its absolute
# R^2 -- absolute recovery falls in BOTH arms whenever amplitude drops, which is not the
# prediction) across cells, at a matched step, with the ablation retrained under each
# generator:
#   3 shrinks the deficit, 4 does not   ratio is causal. The objective is rejecting evidence
#                                       that transforms unequally across views, and the
#                                       benchmark mislabels that evidence as content.
#   3 and 4 degrade alike               amplitude is doing the work, the ratio is a passenger,
#                                       and alignability stays correlational.
#   neither changes                     the cause is something else about a small interior
#                                       structure; go back to the hypothesis list.
#
#   python scripts/launch.py experiments/synthetic_csf_matched.yaml --cluster runai
#   python scripts/launch.py experiments/synthetic_csf_matched.yaml --cluster runai \
#       --set synthetic_csf_t1_intensity=0.342 synthetic_csf_flair_intensity=0.203  # cell 4
#
# Verify the steps BEFORE spending the GPU -- checkpoint-free, ~minutes:
#   python -m eval.view_consistency --preset flagship --res 64 --identifiable-ventricle \
#     --content-prior uniform --content-squash none --lesion-radius 0.14 \
#     --cortex-parameterization patterned --center-local-deformations \
#     --csf-t1-intensity 0.45 --csf-flair-intensity 0.05
#   # ventricle_size ||FLAIR||/||T1|| should read ~1.000, against 0.428 at the default.

_base_: synthetic_identifiable
tag: synthetic-csf-matched-ratio

synthetic_csf_t1_intensity: 0.45
synthetic_csf_flair_intensity: 0.05
