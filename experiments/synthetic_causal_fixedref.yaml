# Verification run: same as synthetic_causal but with fixed_reference
# normalization, which preserves global style gain/bias into the encoder
# input (per_sample z-scoring erases them). Used to test whether style
# channels can recover gain/bias once the input-level eraser is removed.
_base_: synthetic_causal

tag: synthetic-causal-random-fixedref
synthetic_normalize: fixed_reference
synthetic_causal: true
synthetic_causal_graph: random
synthetic_causal_edge_prob: 0.5
scale_contrastive_loss: 100
inject_style_to_decoder: true
tau: 0.1
patch_grid: [4, 4, 4]
train_steps: 300000
# spatial_size: 4
vqvae_nb_levels: 1
eval_dci: true
checkpoint_steps: 1000
scale_adv_loss: 0.0
# style_dropout_prob: 0.2
vqvae_hidden_channels: 48
vqvae_embed_dim: 48
vqvae_scaling_rates: [4]
deterministic: true
content_size: 44
style_injection_mode: concat
