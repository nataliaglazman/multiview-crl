# Dose-response step 3 of 4 from conv_mlp_lesion_anatfixed: conv_mlp_lesion_anat3 plus asymmetry, so
# brain size, thickness, ventricle and asymmetry vary; temporal and sulcal stay at their mean anatomy. Only
# synthetic_content_amp_scale differs from conv_mlp_lesion_anatfixed (see conv_mlp_lesion_anat2 for its indexing).
_base_: encoder/synthetic_defaults
tag: conv_mlp_lesion_anat4_s{seed}
conv_readout: mlp
standardize_code: true
synthetic_content_amp_scale: [1, 1, 1, 1, 1, 1, 0, 1, 0]
eval_every: 1000
